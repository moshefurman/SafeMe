# ─────────────────────────────────────────────────────────────
#  SafeMe — פריסה ב-Render
#
#  שני שירותים ובסיס נתונים אחד: API ב-Docker, והפורטל כאתר סטטי.
#  המשימות המתוזמנות רצות בתוך ה-API עם נעילת Postgres, ולכן אין
#  צורך ב-Worker, ב-Cron Job וב-Redis.
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: safeme-api
    runtime: docker

    # שלושתם ביחס לשורש הריפו. rootDir הוא הקובע: בלעדיו Render
    # מחפש Dockerfile בשורש, והבנייה נכשלת לפני שהיא מתחילה.
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: standard

    # שני מופעים כדי שפריסה או קריסה לא ינתקו את כל המכשירים בבת אחת
    numInstances: 2

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # משתמש ההגירה. בעל הסכמה, מריץ מיגרציות בלבד.
      - key: DATABASE_URL
        fromDatabase:
          name: safeme-db
          property: connectionString

      # משתמש האפליקציה. עליו נאכף RLS.
      # נוצר ידנית אחרי המיגרציה הראשונה, ראה deploy/render.md
      - key: DATABASE_URL_APP
        sync: false

      - key: DEVICE_TOKEN_SECRET
        generateValue: true

      # חתימה מקומית חסומה בייצור בקוד עצמו
      - key: SIGNER
        value: aws
      - key: SIGNER_KID
        sync: false
      - key: SIGNER_KMS_KEY_ID
        sync: false

  # ── הפורטל ─────────────────────────────────────────────────
  #
  # אתר סטטי ולא שירות: אין לו צד שרת משלו. נבנה מ-portal/ ומוגש
  # מה-CDN.
  - type: web
    name: safeme-portal
    runtime: static

    rootDir: portal
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # נעילת גרסת Node לבנייה. בלעדיה ברירת המחדל של Render יכולה
      # להשתנות מתחת לרגליים ולשבור בנייה שעבדה אתמול.
      - key: NODE_VERSION
        value: "22"

    # הסדר קובע: הכלל הראשון שמתאים הוא זה שרץ.
    routes:
      # ── הכלל שבלעדיו הכניסה נשברת ──
      #
      # מבחינת הדפדפן הפורטל וה-API הם מקור אחד. זה לא נוחות אלא
      # תנאי: עוגיית ההפעלה היא HttpOnly עם SameSite=Strict ובלי
      # Domain, והפורטל שולח credentials: "same-origin". מול מקור
      # אחר העוגייה לא הייתה נשלחת כלל, והכניסה הייתה נכשלת בשקט
      # — בלי שגיאה שמסבירה למה.
      #
      # ⚠ הכתובת היא זו שהשירות קיבל בפועל, ולא <name>.onrender.com.
      # Render מוסיף סיומת אקראית כששם השירות תפוס אצל מישהו אחר,
      # וזה בדיוק מה שקרה כאן: השם safeme-api היה תפוס, והשירות
      # קיבל safeme-h7h4. אם תיצור את השירות מחדש והסיומת תשתנה,
      # יש לעדכן כאן — אחרת הפורטל יעלה והכניסה תיכשל בשקט.
      - type: rewrite
        source: /api/*
        destination: https://safeme-h7h4.onrender.com/api/*

      # הפורטל מנווט במצב מקומי ולא בנתיבים, אבל רענון של כתובת
      # שאינה השורש — או כתובת שהודבקה — חייב עדיין להחזיר את הדף.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: safeme-db
    databaseName: safeme
    region: frankfurt
    plan: standard

    # בסיס הנתונים אינו חשוף לאינטרנט. רק שירותים באותה רשת
    # פרטית יכולים להתחבר אליו.
    ipAllowList: []
