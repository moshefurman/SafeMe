<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    אייקון הלשונית.

    אותו מסלול מגן בדיוק כמו ShieldRenderer.BuildShieldPath בסוכן
    וכמו רכיב Shield בפורטל, באותה מערכת קואורדינטות 0..100.
    מסלול אחד לשלושתם, כדי שהצורה לא תיפרד בין הפלטפורמות.

    SVG ולא PNG: הלשונית מוצגת ב-16 פיקסלים ובמסכי Retina ב-32,
    ווקטור נשאר חד בשניהם בלי לשלוח שתי תמונות.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7bb4"/>
      <stop offset="1" stop-color="#1f5c8b"/>
    </linearGradient>
  </defs>

  <path d="M 8,15 A 10,10 0 0 1 18,5 L 82,5 A 10,10 0 0 1 92,15
           L 92,32 C 92,62 78,81 50,96 C 22,81 8,62 8,32 Z"
        fill="url(#g)"/>

  <path d="M 8,15 A 10,10 0 0 1 18,5 L 82,5 A 10,10 0 0 1 92,15
           L 92,32 C 92,62 78,81 50,96 C 22,81 8,62 8,32 Z"
        fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <path d="M 31,52 L 43,64 L 69,36"
        fill="none" stroke="#fff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
